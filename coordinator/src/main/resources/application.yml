spring:
  application:
    name: coordinator
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healstore}
    username: ${DATABASE_USER:healstore}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8443}
  shutdown: graceful
  ssl:
    enabled: true
    key-store: ${TLS_KEY_STORE:}
    key-store-password: ${TLS_STORE_PASSWORD:}
    key-store-type: PKCS12
    trust-store: ${TLS_TRUST_STORE:}
    trust-store-password: ${TLS_STORE_PASSWORD:}
    trust-store-type: PKCS12
    client-auth: need
    enabled-protocols: TLSv1.3,TLSv1.2
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
